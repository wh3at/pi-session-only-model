name: Verify release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact immutable npm version to verify (semver, e.g. 0.1.0)
        required: true
        type: string
      expected_commit:
        description: Authorized release commit SHA (required for published verification)
        required: false
        type: string
      expected_digest:
        description: SHA-256 hex digest of the published tarball (64 lowercase hex chars)
        required: true
        type: string
      probe_unavailable:
        description: Safe probe — fail on a non-existent version without publish/OIDC paths
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  PACKAGE_NAME: pi-session-only-model
  CANONICAL_REPO: wh3at/pi-session-only-model
  CANONICAL_REPO_URL: https://github.com/wh3at/pi-session-only-model
  CATALOG_OWNER: wh3at
  CATALOG_POLL_MAX_ATTEMPTS: 24
  CATALOG_POLL_INTERVAL_SECONDS: 3600

jobs:
  workflow-policy:
    name: Workflow policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Enforce verify-release workflow policy
        run: |
          set -euo pipefail
          workflow=".github/workflows/verify-release.yml"

          if grep -Eq '^[[:space:]]*pull_request_target:' "$workflow"; then
            echo "pull_request_target is forbidden in verify-release workflow"
            exit 1
          fi

          if grep -Eq 'id-token:[[:space:]]*write|packages:[[:space:]]*write|contents:[[:space:]]*write' "$workflow"; then
            echo "write permissions are forbidden in verify-release workflow"
            exit 1
          fi

          if grep -Eq '\$\{\{[[:space:]]*secrets\.|NODE[_]AUTH_TOKEN|NPM[_]TOKEN[[:space:]]*=' "$workflow"; then
            echo "secrets and NPM_TOKEN are forbidden in verify-release workflow"
            exit 1
          fi

          if grep -Eq '^[[:space:]]*environment:' "$workflow"; then
            echo "protected environments are forbidden in verify-release workflow"
            exit 1
          fi

          if grep -Eq 'npm[[:space:]]+publish|npm[[:space:]]+unpublish|npm[[:space:]]+deprecate' "$workflow"; then
            echo "publish or rollback commands are forbidden in verify-release workflow"
            exit 1
          fi

          unpinned="$(grep -E '^[[:space:]]*uses:' "$workflow" | grep -Ev '@[0-9a-f]{40}' || true)"
          if [ -n "$unpinned" ]; then
            echo "every uses: reference must be pinned to a full commit SHA"
            echo "$unpinned"
            exit 1
          fi

          if ! grep -Fq 'expected_digest must be 64 lowercase hex characters' "$workflow"; then
            echo "verify-release must require and validate expected_digest"
            exit 1
          fi

          echo "verify-release workflow policy checks passed"

  probe-unavailable:
    name: Probe unavailable version
    if: ${{ inputs.probe_unavailable }}
    needs: workflow-policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 24
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: "24"

      - name: Reject non-existent version without publish path
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          workflow=".github/workflows/verify-release.yml"

          if grep -Eq 'npm[[:space:]]+publish|id-token:[[:space:]]*write|environment:[[:space:]]*npm' "$workflow"; then
            echo "probe detected forbidden publish or OIDC path in workflow"
            exit 1
          fi

          if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "version must be a strict semver for probe input: ${INPUT_VERSION}"
            exit 1
          fi

          if npm view "${PACKAGE_NAME}@${INPUT_VERSION}" version >/dev/null 2>&1; then
            echo "probe version unexpectedly exists on npm: ${PACKAGE_NAME}@${INPUT_VERSION}"
            exit 1
          fi

          echo "unavailable-version probe passed: ${PACKAGE_NAME}@${INPUT_VERSION} is absent and no publish path is present"

  verify-release:
    name: Verify published release
    if: ${{ !inputs.probe_unavailable }}
    needs: workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 1500
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 24
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: "24"

      - name: Validate inputs
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
        run: |
          set -euo pipefail
          mkdir -p verification-evidence

          if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version must be a strict immutable semver: ${INPUT_VERSION}"
            exit 1
          fi

          if [ -z "$EXPECTED_COMMIT" ]; then
            echo "expected_commit is required for published verification"
            exit 1
          fi

          if ! printf '%s' "$EXPECTED_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "expected_commit must be a 40-character git SHA"
            exit 1
          fi

          if [ -z "$EXPECTED_DIGEST" ]; then
            echo "expected_digest is required for published verification"
            exit 1
          fi

          if ! printf '%s' "$EXPECTED_DIGEST" | grep -Eq '^[a-f0-9]{64}$'; then
            echo "expected_digest must be 64 lowercase hex characters"
            exit 1
          fi

          echo "inputs ok version=${INPUT_VERSION} expected_commit=${EXPECTED_COMMIT} expected_digest=${EXPECTED_DIGEST}"

      - name: Verify npm registry metadata and digest
        id: registry
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
        run: |
          set -euo pipefail
          mkdir -p verification-evidence

          if ! npm view "${PACKAGE_NAME}@${INPUT_VERSION}" version >/dev/null 2>&1; then
            echo "registry version does not exist: ${PACKAGE_NAME}@${INPUT_VERSION}"
            echo "verification stops before Pi install; no publish or rollback path exists"
            exit 1
          fi

          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { writeFile } from "node:fs/promises";
          import { execFile } from "node:child_process";
          import { promisify } from "node:util";

          const execFileAsync = promisify(execFile);
          const version = process.env.INPUT_VERSION;
          const expectedCommit = process.env.EXPECTED_COMMIT;
          const expectedDigest = process.env.EXPECTED_DIGEST?.trim() ?? "";
          if (!/^[a-f0-9]{64}$/.test(expectedDigest)) {
            throw new Error("expected_digest must be 64 lowercase hex characters");
          }
          const packageName = process.env.PACKAGE_NAME;
          const canonicalRepo = process.env.CANONICAL_REPO;
          const canonicalRepoUrl = process.env.CANONICAL_REPO_URL;

          const { stdout } = await execFileAsync(
            "npm",
            ["view", `${packageName}@${version}`, "--json"],
            { env: process.env },
          );
          const metadata = JSON.parse(stdout);
          const repositoryUrl = String(metadata.repository?.url ?? "");
          if (!repositoryUrl.includes(canonicalRepo)) {
            throw new Error(`repository mismatch: ${repositoryUrl}`);
          }

          const keywords = metadata.keywords ?? [];
          if (!keywords.includes("pi-package")) {
            throw new Error("package metadata missing pi-package keyword");
          }

          const tarballUrl = metadata.dist?.tarball;
          if (!tarballUrl) {
            throw new Error("registry metadata missing dist.tarball");
          }

          const tarballResponse = await fetch(tarballUrl);
          if (!tarballResponse.ok) {
            throw new Error(`unable to download tarball: ${tarballResponse.status}`);
          }
          const tarballBytes = Buffer.from(await tarballResponse.arrayBuffer());
          const digest = createHash("sha256").update(tarballBytes).digest("hex");
          if (digest !== expectedDigest) {
            throw new Error(`digest mismatch: expected ${expectedDigest}, received ${digest}`);
          }

          const tagRef = await fetch(
            `https://api.github.com/repos/${canonicalRepo}/git/ref/tags/v${version}`,
          );
          if (!tagRef.ok) {
            throw new Error(`missing release tag v${version} on ${canonicalRepo}`);
          }
          const tagPayload = await tagRef.json();
          let tagCommit = tagPayload.object?.sha;
          if (tagPayload.object?.type === "tag") {
            const tagObj = await fetch(
              `https://api.github.com/repos/${canonicalRepo}/git/tags/${tagCommit}`,
            );
            if (!tagObj.ok) {
              throw new Error(`unable to resolve annotated tag v${version}`);
            }
            const tagDetails = await tagObj.json();
            tagCommit = tagDetails.object?.sha;
          }
          if (!tagCommit || tagCommit !== expectedCommit) {
            throw new Error(
              `tag v${version} commit mismatch: expected ${expectedCommit}, received ${tagCommit ?? "missing"}`,
            );
          }

          const mainHead = await fetch(
            `https://api.github.com/repos/${canonicalRepo}/commits/main`,
          );
          if (!mainHead.ok) {
            throw new Error("unable to fetch canonical main head");
          }
          const mainPayload = await mainHead.json();
          const mainSha = mainPayload.sha;
          if (mainSha !== expectedCommit) {
            throw new Error(
              `expected commit is not current main head: main=${mainSha} expected=${expectedCommit}`,
            );
          }

          const evidence = {
            package: packageName,
            version,
            repositoryUrl,
            tarballUrl,
            integrity: metadata.dist?.integrity ?? null,
            shasum: metadata.dist?.shasum ?? null,
            digest,
            tag: `v${version}`,
            tagCommit,
            mainHead: mainSha,
            canonicalRepoUrl,
          };
          await writeFile("verification-evidence/registry.json", JSON.stringify(evidence, null, 2));
          console.log(`registry verification ok ${packageName}@${version} digest=${digest}`);
          NODE

      - name: Verify provenance and registry signatures
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/npm-provenance && cd /tmp/npm-provenance
          npm init -y >/dev/null 2>&1
          npm install "${PACKAGE_NAME}@${INPUT_VERSION}" --ignore-scripts --no-save >/dev/null 2>&1
          audit_exit=0
          if ! npm audit signatures --json --include-attestations > audit.json 2>audit.stderr; then
            audit_exit=1
          fi
          if [ ! -s audit.json ]; then
            echo "npm audit signatures did not produce JSON output"
            cat audit.stderr
            exit 1
          fi

          export AUDIT_EXIT="$audit_exit"
          node --experimental-strip-types <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          import { join } from "node:path";
          import { pathToFileURL } from "node:url";

          const verifyModule = pathToFileURL(
            join(process.env.GITHUB_WORKSPACE, "scripts/verify-package.mjs"),
          ).href;
          const { validateProvenanceAudit } = await import(verifyModule);

          const version = process.env.INPUT_VERSION;
          const expectedCommit = process.env.EXPECTED_COMMIT;
          const packageName = process.env.PACKAGE_NAME;
          const auditExit = Number(process.env.AUDIT_EXIT ?? "0");

          let audit;
          try {
            audit = JSON.parse(await readFile("audit.json", "utf8"));
          } catch (error) {
            throw new Error(
              `npm audit signatures output is not valid JSON: ${error instanceof Error ? error.message : String(error)}`,
            );
          }

          const provenanceEvidence = validateProvenanceAudit(audit, packageName, version, expectedCommit);
          if (auditExit !== 0 && version !== "0.0.0" && !provenanceEvidence.provenancePredicateTypes.length) {
            throw new Error("npm audit signatures command failed without valid target attestations");
          }
          if (version === "0.0.0" && !provenanceEvidence.provenancePredicateTypes.length) {
            console.log(
              "bootstrap 0.0.0 without provenance attestations — digest and tag checks remain authoritative",
            );
          }

          await writeFile(
            `${process.env.GITHUB_WORKSPACE}/verification-evidence/provenance.json`,
            JSON.stringify(provenanceEvidence, null, 2),
          );
          console.log("provenance verification ok");
          NODE

      - name: Install exact version in fresh Pi home
        id: pi-install
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PI_HOME="${RUNNER_TEMP}/pi-verify-home"
          VERIFIER_DIR="${RUNNER_TEMP}/pi-verifier"
          export PI_CODING_AGENT_DIR="${PI_HOME}/agent"
          mkdir -p "$PI_CODING_AGENT_DIR"
          mkdir -p "${GITHUB_WORKSPACE}/verification-evidence"

          mkdir -p "$VERIFIER_DIR"
          cd "$VERIFIER_DIR"
          npm init -y >/dev/null 2>&1
          npm install @earendil-works/pi-coding-agent@0.80.10 --ignore-scripts --no-save >/dev/null 2>&1
          PI_BIN="${VERIFIER_DIR}/node_modules/.bin/pi"

          "$PI_BIN" install "npm:${PACKAGE_NAME}@${INPUT_VERSION}"

          "$PI_BIN" list | tee "${GITHUB_WORKSPACE}/verification-evidence/pi-list.txt"
          if ! "$PI_BIN" list | grep -Fq "npm:${PACKAGE_NAME}@${INPUT_VERSION}"; then
            echo "pi list does not show exact installed version"
            exit 1
          fi

          export PI_OFFLINE=1

          node --input-type=module <<'NODE'
          import { createAgentSession, ModelRuntime, SessionManager, SettingsManager } from "@earendil-works/pi-coding-agent";
          import { mkdtemp } from "node:fs/promises";
          import { tmpdir } from "node:os";
          import { join } from "node:path";
          import { writeFile } from "node:fs/promises";

          const version = process.env.INPUT_VERSION;
          const packageName = process.env.PACKAGE_NAME;
          const agentDir = process.env.PI_CODING_AGENT_DIR;
          const cwd = await mkdtemp(join(tmpdir(), "pi-verify-cwd-"));

          const modelRuntime = await ModelRuntime.create({ modelsPath: null, allowModelNetwork: false });
          modelRuntime.registerProvider("verify", {
            baseUrl: "https://example.invalid/v1",
            apiKey: "dummy",
            api: "openai-completions",
            models: [
              {
                id: "m1",
                name: "m1",
                reasoning: false,
                input: ["text"],
                cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 },
                contextWindow: 10000,
                maxTokens: 1000,
              },
            ],
          });

          const settingsManager = SettingsManager.create(cwd, agentDir);
          const sessionManager = SessionManager.inMemory(cwd);
          const { session } = await createAgentSession({
            cwd,
            agentDir,
            modelRuntime,
            settingsManager,
            sessionManager,
            noTools: "all",
          });
          await session.bindExtensions({ mode: "print" });

          await session.prompt("/session-only-model verify/m1");
          if (session.model?.id !== "m1") {
            throw new Error(`session-only-model command did not load expected model: ${session.model?.id ?? "missing"}`);
          }

          await session.extensionRunner.emit({ type: "session_shutdown", reason: "quit" });
          session.dispose();

          const evidence = {
            package: packageName,
            version,
            installCommand: `pi install npm:${packageName}@${version}`,
            agentDir,
            cwd,
            loadedModelId: session.model?.id,
            devDependenciesUsed: false,
          };
          await writeFile(
            `${process.env.GITHUB_WORKSPACE}/verification-evidence/pi-install.json`,
            JSON.stringify(evidence, null, 2),
          );
          console.log(`pi install smoke ok ${packageName}@${version}`);
          NODE

      - name: Poll Pi catalog with bounded hourly attempts
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          mkdir -p verification-evidence
          attempts=()
          found=false
          max_attempts="${CATALOG_POLL_MAX_ATTEMPTS}"
          interval="${CATALOG_POLL_INTERVAL_SECONDS}"
          install_command="pi install npm:${PACKAGE_NAME}@${INPUT_VERSION}"

          for attempt in $(seq 1 "$max_attempts"); do
            timestamp="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            npm_search="$(curl -fsSL "https://registry.npmjs.org/-/v1/search?text=keywords:pi-package+${PACKAGE_NAME}" || true)"
            pi_catalog="$(curl -fsSL "https://pi.dev/packages" || true)"
            npm_hit=false
            catalog_hit=false

            if printf '%s' "$npm_search" | grep -Fq "\"name\":\"${PACKAGE_NAME}\""; then
              npm_hit=true
            fi
            if printf '%s' "$pi_catalog" | grep -Fq "${PACKAGE_NAME}" && printf '%s' "$pi_catalog" | grep -Fq "$install_command"; then
              catalog_hit=true
            fi

            attempts+=("attempt=${attempt} at=${timestamp} npm_search=${npm_hit} pi_catalog=${catalog_hit}")
            echo "catalog attempt ${attempt}/${max_attempts}: npm_search=${npm_hit} pi_catalog=${catalog_hit}"

            if npm_hit && catalog_hit; then
              found=true
              break
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep "$interval"
            fi
          done

          retry_date="$(date -u -d "+1 day" +"%Y-%m-%d")"
          evidence_dir="${GITHUB_WORKSPACE}/verification-evidence"
          printf '%s\n' "${attempts[@]}" > "${evidence_dir}/catalog-attempts.log"

          export CATALOG_FOUND="$found"
          export CATALOG_RETRY_DATE="$retry_date"
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const evidenceDir = `${process.env.GITHUB_WORKSPACE}/verification-evidence`;
          const attempts = (await readFile(`${evidenceDir}/catalog-attempts.log`, "utf8"))
            .split("\n")
            .filter(Boolean);
          const found = process.env.CATALOG_FOUND === "true";

          const evidence = {
            package: process.env.PACKAGE_NAME,
            version: process.env.INPUT_VERSION,
            installCommand: `pi install npm:${process.env.PACKAGE_NAME}@${process.env.INPUT_VERSION}`,
            maxAttempts: Number(process.env.CATALOG_POLL_MAX_ATTEMPTS),
            pollIntervalSeconds: Number(process.env.CATALOG_POLL_INTERVAL_SECONDS),
            attempts,
            catalogListed: found,
            r14Satisfied: found,
            owner: process.env.CATALOG_OWNER,
            retryDate: process.env.CATALOG_RETRY_DATE,
            followUpRequired: !found,
            note: found
              ? "Catalog listing verified within bounded polling."
              : "R14 remains open. Catalog indexing delayed. No npm rollback attempted.",
          };

          await writeFile(`${evidenceDir}/catalog.json`, JSON.stringify(evidence, null, 2));
          NODE

          if [ "$found" != true ]; then
            echo "R14 catalog listing not verified after ${max_attempts} hourly attempts."
            echo "Owner: ${CATALOG_OWNER}"
            echo "Retry after: ${retry_date}"
            echo "No publish, unpublish, deprecate, or rollback command was executed."
            exit 1
          fi

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75dc225b5c5cd846dc2ae7f4873 # v4.6.2
        with:
          name: verify-release-evidence-${{ inputs.version }}
          path: verification-evidence/
          if-no-files-found: warn
          retention-days: 30
